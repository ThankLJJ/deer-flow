# ============================================================
# 离线部署专用 docker-compose（纯 image 模式，无需源码构建）
#
# 服务器上不需要 frontend 源码、node、pnpm —— 镜像已在开发机
# 构建好并随 tar 包一起传过来，只需 docker load + up 即可。
#
# 唯一需要挂载的"源码"是 sqlQuery/backend（2MB 纯 Python），
# 因为 LangGraph Server 启动时要读 langgraph.json + graph.py。
#
# 使用：
#   docker compose -f docker-compose.offline.yml --env-file .env.docker up -d
# ============================================================

services:
  # ───────────── 前端（Next.js standalone，已烘焙好配置）─────────────
  frontend:
    image: deerflow-frontend:latest
    container_name: deerflow-frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DEER_FLOW_AUTH_DISABLED: "1"
    networks:
      - deerflow-net

  # ───────────── FastAPI 辅助 API ─────────────
  backend:
    image: ${SQLQUERY_BACKEND_IMAGE:-dataagent-backend:latest}
    container_name: deerflow-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # 同源访问，允许 nginx 反代过来的请求
      FRONTEND_URL: "*"
    volumes:
      # workspace 持久化（uploads、sandbox 生成的文件、artifacts）
      - ${WORKSPACE_DIR:-./data/workspace}:/app/workspace
    # 镜像默认 CMD 跑在 :80（Dockerfile.backend EXPOSE 80），
    # 这里显式覆盖到 :8001，与 nginx upstream backend:8001 对齐。
    # 注意：若删除此 command，容器会回到 :80，nginx 将连不上。
    expose:
      - "8001"
    command: ["python3", "-m", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8001"]
    networks:
      - deerflow-net

  # ───────────── LangGraph Server ─────────────
  langgraph:
    image: langchain/langgraph-api:latest
    container_name: deerflow-langgraph
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # 告诉 LangGraph Server 配置文件所在目录
      LANGGRAPH_CONFIG_DIR: /app
      # 允许同步 DB 驱动（PyMySQLSaver 是同步的）
      LANGGRAPH_ALLOW_BLOCKING: "1"
    volumes:
      # 只挂载 sqlQuery 源码（含 langgraph.json、backend/、.env）
      # 2MB 纯 Python，离线包里已带 sqlquery-src/
      - ${SQLQUERY_PATH:-./sqlquery-src}:/app
    expose:
      - "2024"
    command: ["--host", "0.0.0.0", "--port", "2024", "--no-browser"]
    depends_on:
      - backend
    networks:
      - deerflow-net

  # ───────────── 统一入口 nginx ─────────────
  nginx:
    image: deerflow-nginx:latest
    container_name: deerflow-nginx
    restart: unless-stopped
    ports:
      # 唯一对外端口
      - "${EXPOSE_PORT:-80}:80"
    depends_on:
      - frontend
      - backend
      - langgraph
    networks:
      - deerflow-net

networks:
  deerflow-net:
    driver: bridge
