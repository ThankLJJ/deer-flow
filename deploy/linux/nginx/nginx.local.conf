# DeerFlow 前端 + sqlQuery backend 统一反代（本地验证版，无 langgraph）
# 同源访问，避免 CORS/CSRF 跨域问题

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # SSE 必须关闭缓冲
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # 上游服务（docker-compose 内部 DNS）
    upstream frontend_upstream {
        server frontend:3000;
    }
    upstream backend_upstream {
        # 端口须与 docker-compose.local.yml 里 backend 的 command --port 一致
        server backend:8003;
    }

    server {
        listen 80;
        server_name _;

        # 允许大文件上传（CSV/Excel 等）
        client_max_body_size 100m;

        # ---------- 前端 SSR + 静态资源 ----------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Next.js HMR / WebSocket（生产一般不用，保留兼容）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ---------- LangGraph Platform 兼容（流式聊天）----------
        # LangGraph 兼容接口已内嵌到 backend（不再用 langgraph-api 镜像）。
        # 前端 useStream 的 baseURL 是 ${origin}/api/langgraph，SDK 在后面拼 /threads/{id}/runs/stream 等。
        # 这里 rewrite 把 /api/langgraph/xxx → /api/xxx，转给 backend 的 langgraph_compat router。
        # 注意：必须放在通用的 /api/ 块前面，否则会被 catch-all 抢先匹配。
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*)$ /api/$1 break;
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ---------- FastAPI 辅助 API ----------
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ---------- 健康检查 ----------
        location = /healthz {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
