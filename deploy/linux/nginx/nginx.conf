# DeerFlow 前端 + sqlQuery backend 统一反代
# 同源访问，避免 CORS/CSRF 跨域问题

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # SSE 必须关闭缓冲
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;

    # 上游服务（docker-compose 内部 DNS）
    upstream frontend_upstream {
        server frontend:3000;
    }
    upstream backend_upstream {
        server backend:8001;
    }
    upstream langgraph_upstream {
        server langgraph:2024;
    }

    server {
        listen 80;
        server_name _;

        # 允许大文件上传（CSV/Excel 等）
        client_max_body_size 100m;

        # ---------- 前端 SSR + 静态资源 ----------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Next.js HMR / WebSocket（生产一般不用，保留兼容）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ---------- LangGraph Server（流式聊天）----------
        # 注意：前端 LangGraph SDK 调用 ${origin}/threads/* 和 /runs/*
        # 不走 /api/langgraph 前缀（因为 .env 中 NEXT_PUBLIC_LANGGRAPH_BASE_URL 为空时
        # getLangGraphBaseURL 返回 ${origin}/api/langgraph —— 这里加 rewrite 兼容两种）
        location /threads/ {
            proxy_pass http://langgraph_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        location /runs/ {
            proxy_pass http://langgraph_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # 兼容前端默认 /api/langgraph/* 路径（剥离前缀再转发）
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*)$ /$1 break;
            proxy_pass http://langgraph_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # ---------- FastAPI 辅助 API ----------
        # 注意 /api/langgraph 必须在前（已上面），否则会被这条 catch-all 抢先匹配
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # ---------- 健康检查 ----------
        location = /healthz {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}
